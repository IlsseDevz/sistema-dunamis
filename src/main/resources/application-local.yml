spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS dunamis
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false

  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    com.dunamis.sistema: DEBUG
    org.springframework.security: INFO
