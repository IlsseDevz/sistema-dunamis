<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Membros')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/admin-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
                <h1 class="h4 mb-0">Membros</h1>
                <span class="text-muted small" th:text="${members.totalElements} + ' registo(s)'">0</span>
            </div>

            <div class="card card-dunamis mb-4">
                <div class="card-body p-3">
                    <form method="get" action="/admin/membros" class="row g-2">
                        <div class="col-12 col-md-4">
                            <input type="text" name="search" class="form-control" placeholder="Nome ou contacto"
                                   th:value="${search}">
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="situation" class="form-select">
                                <option value="">Situação</option>
                                <option th:each="s : ${churchSituations}" th:value="${s}" th:text="${s.label}"
                                        th:selected="${situation == s}"></option>
                            </select>
                        </div>
                        <div class="col-6 col-md-2">
                            <input type="text" name="bairro" class="form-control" placeholder="Bairro"
                                   th:value="${bairro}">
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="baptized" class="form-select">
                                <option value="">Batismo</option>
                                <option value="true" th:selected="${baptized == true}">Batizado</option>
                                <option value="false" th:selected="${baptized == false}">Não batizado</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="functionId" class="form-select">
                                <option value="">Função</option>
                                <option th:each="f : ${churchFunctions}" th:value="${f.id}" th:text="${f.label}"
                                        th:selected="${functionId != null and functionId == f.id}"></option>
                            </select>
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="accountStatus" class="form-select">
                                <option value="">Conta</option>
                                <option th:each="st : ${accountStatuses}" th:value="${st}" th:text="${st.label}"
                                        th:selected="${accountStatus == st}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-md-2 d-grid">
                            <button type="submit" class="btn btn-dunamis">Filtrar</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card card-dunamis">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th class="d-none d-md-table-cell">Contacto</th>
                            <th class="d-none d-lg-table-cell">Situação</th>
                            <th class="d-none d-lg-table-cell">Bairro</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${members.content}">
                            <td>
                                <strong th:text="${m.fullName}">Nome</strong>
                                <div class="d-md-none small text-muted" th:text="${m.contacto}"></div>
                            </td>
                            <td class="d-none d-md-table-cell" th:text="${m.contacto}">—</td>
                            <td class="d-none d-lg-table-cell" th:text="${m.churchSituation.label}">—</td>
                            <td class="d-none d-lg-table-cell" th:text="${m.bairro}">—</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${m.accountStatus.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${m.accountStatus.label}">—</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/admin/membros/{id}(id=${m.id})}" class="btn btn-sm btn-dunamis-outline">Ver</a>
                            </td>
                        </tr>
                        <tr th:if="${members.totalElements == 0}">
                            <td colspan="6" class="text-center text-muted py-4">Nenhum membro encontrado.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav th:if="${members.totalPages > 1}" class="mt-3" aria-label="Paginação">
                <ul class="pagination justify-content-center flex-wrap">
                    <li class="page-item" th:classappend="${members.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/membros(page=${members.number - 1}, search=${search}, situation=${situation}, bairro=${bairro}, baptized=${baptized}, functionId=${functionId}, accountStatus=${accountStatus})}">Anterior</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="${members.number + 1} + ' / ' + ${members.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${members.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/membros(page=${members.number + 1}, search=${search}, situation=${situation}, bairro=${bairro}, baptized=${baptized}, functionId=${functionId}, accountStatus=${accountStatus})}">Próximo</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
