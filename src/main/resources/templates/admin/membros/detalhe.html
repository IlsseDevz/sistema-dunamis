<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhe do membro')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/admin-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card card-dunamis">
                <div class="card-body p-4">
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4">
                        <div>
                            <h1 class="h4 mb-1" th:text="${member.fullName}">Membro</h1>
                            <span class="badge"
                                  th:classappend="${member.accountStatus.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${member.accountStatus.label}">—</span>
                            <span th:if="${isStudent}" class="badge text-bg-info ms-1">Aluno EB</span>
                        </div>
                        <div class="d-grid d-sm-flex gap-2">
                            <a th:href="@{/admin/membros/{id}/editar(id=${member.id})}" class="btn btn-dunamis btn-sm">Editar</a>
                            <a href="/admin/membros" class="btn btn-dunamis-outline btn-sm">Voltar</a>
                        </div>
                    </div>

                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Contacto</span>
                            <strong th:text="${member.contacto}">—</strong>
                        </li>
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Email</span>
                            <strong th:text="${member.email != null ? member.email : '—'}">—</strong>
                        </li>
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Bairro</span>
                            <strong th:text="${member.bairro}">—</strong>
                        </li>
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Situação</span>
                            <strong th:text="${member.churchSituation.label}">—</strong>
                        </li>
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Função</span>
                            <strong th:text="${member.churchFunction.label}">—</strong>
                        </li>
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Batizado</span>
                            <strong th:text="${member.baptized} ? 'Sim' : 'Não'">—</strong>
                        </li>
                        <li class="list-group-item px-0 d-flex justify-content-between">
                            <span class="text-muted">Cadastro</span>
                            <strong th:text="${#temporals.format(member.registeredAt, 'dd/MM/yyyy HH:mm')}">—</strong>
                        </li>
                    </ul>

                    <div class="d-grid d-sm-flex gap-2">
                        <form th:if="${member.accountStatus.name() == 'ACTIVE' and member.id != currentUserId}"
                              th:action="@{/admin/membros/{id}/desactivar(id=${member.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger"
                                    onclick="return confirm('Desactivar esta conta?')">
                                Desactivar conta
                            </button>
                        </form>
                        <form th:if="${member.accountStatus.name() == 'INACTIVE'}"
                              th:action="@{/admin/membros/{id}/activar(id=${member.id})}" method="post">
                            <button type="submit" class="btn btn-dunamis">Activar conta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
