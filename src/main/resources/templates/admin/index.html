<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administração')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/admin-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div class="mb-4">
                <h1 class="h4 mb-1">Painel Administrativo</h1>
                <p class="text-muted mb-0">
                    Igreja Evangélica Dunamis de Jesus Cristo
                </p>
            </div>

            <div class="row g-3">
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Total de membros</span>
                        <strong th:text="${stats.totalMembers}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Membros activos</span>
                        <strong th:text="${stats.activeMembers}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Novos convertidos</span>
                        <strong th:text="${stats.newConverts}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Visitantes</span>
                        <strong th:text="${stats.visitors}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Batizados</span>
                        <strong th:text="${stats.baptized}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Não batizados</span>
                        <strong th:text="${stats.notBaptized}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="admin-stat-card admin-stat-card-accent">
                        <span class="admin-stat-label">Alunos EB</span>
                        <strong th:text="${stats.totalStudents}">0</strong>
                    </div>
                </div>
            </div>

            <div class="card card-dunamis mt-4">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3">Acções rápidas</h2>
                    <div class="d-grid d-sm-flex gap-2">
                        <a href="/admin/membros" class="btn btn-dunamis">Gerir membros</a>
                        <a href="/admin/alunos" class="btn btn-dunamis-outline">Ver alunos</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
