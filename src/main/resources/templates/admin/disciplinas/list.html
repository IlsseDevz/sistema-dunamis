<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Disciplinas')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/admin-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
                <h1 class="h4 mb-0">Disciplinas</h1>
                <a href="/admin/disciplinas/nova" class="btn btn-dunamis btn-sm">Nova disciplina</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card card-dunamis">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th class="d-none d-md-table-cell">Carga horária</th>
                            <th class="d-none d-lg-table-cell">Descrição</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${disciplinas}">
                            <td>
                                <strong th:text="${d.name}">—</strong>
                                <div class="d-md-none small text-muted"
                                     th:if="${d.workloadHours != null}"
                                     th:text="${d.workloadHours} + ' h'">—</div>
                            </td>
                            <td class="d-none d-md-table-cell"
                                th:text="${d.workloadHours != null ? d.workloadHours + ' h' : '—'}">—</td>
                            <td class="d-none d-lg-table-cell text-muted"
                                th:text="${d.description != null ? d.description : '—'}">—</td>
                            <td class="text-end">
                                <div class="table-actions">
                                    <a th:href="@{/admin/disciplinas/{id}/editar(id=${d.id})}"
                                       class="btn btn-sm btn-dunamis-outline">Editar</a>
                                    <form th:action="@{/admin/disciplinas/{id}/remover(id=${d.id})}" method="post"
                                          onsubmit="return confirm('Remover esta disciplina?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(disciplinas)}">
                            <td colspan="4" class="text-center text-muted py-4">
                                Nenhuma disciplina cadastrada.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
