<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Escola Bíblica')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/admin-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div class="mb-4">
                <h1 class="h4 mb-1">Escola Bíblica do Pregador Dunamis</h1>
                <p class="text-muted mb-0">Gestão académica da igreja</p>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-md-4">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Turma activa</span>
                        <strong th:text="${overview.turma.name}">—</strong>
                        <div class="small text-muted mt-1" th:text="'Ano ' + ${overview.turma.year}">—</div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="admin-stat-card">
                        <span class="admin-stat-label">Disciplinas</span>
                        <strong th:text="${overview.totalDisciplinas}">0</strong>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="admin-stat-card admin-stat-card-accent">
                        <span class="admin-stat-label">Alunos inscritos</span>
                        <strong th:text="${overview.totalAlunos}">0</strong>
                    </div>
                </div>
            </div>

            <div class="card card-dunamis">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3">Acções</h2>
                    <div class="d-grid d-sm-flex flex-wrap gap-2">
                        <a href="/admin/turma" class="btn btn-dunamis">Gerir turma</a>
                        <a href="/admin/disciplinas" class="btn btn-dunamis-outline">Disciplinas</a>
                        <a href="/admin/alunos" class="btn btn-dunamis-outline">Alunos</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
