<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alunos')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/admin-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div class="mb-4">
                <h1 class="h4 mb-1">Alunos</h1>
                <p class="text-muted mb-0">
                    Turma: <strong th:text="${turma.name}">—</strong>
                </p>
            </div>

            <div class="card card-dunamis mb-4">
                <div class="card-body p-3">
                    <form method="get" action="/admin/alunos" class="row g-2">
                        <div class="col-12 col-md-8">
                            <input type="text" name="search" class="form-control" placeholder="Nome ou contacto"
                                   th:value="${search}">
                        </div>
                        <div class="col-12 col-md-4 d-grid">
                            <button type="submit" class="btn btn-dunamis">Pesquisar</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card card-dunamis">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Aluno</th>
                            <th class="d-none d-md-table-cell">Contacto</th>
                            <th class="d-none d-lg-table-cell">Inscrição</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="i : ${alunos.content}">
                            <td>
                                <strong th:text="${i.user.fullName}">—</strong>
                                <div class="d-md-none small text-muted" th:text="${i.user.contacto}"></div>
                            </td>
                            <td class="d-none d-md-table-cell" th:text="${i.user.contacto}">—</td>
                            <td class="d-none d-lg-table-cell"
                                th:text="${#temporals.format(i.enrollmentDate, 'dd/MM/yyyy')}">—</td>
                            <td class="text-end">
                                <a th:href="@{/admin/membros/{id}(id=${i.user.id})}"
                                   class="btn btn-sm btn-dunamis-outline">Ver membro</a>
                            </td>
                        </tr>
                        <tr th:if="${alunos.totalElements == 0}">
                            <td colspan="4" class="text-center text-muted py-4">Nenhum aluno inscrito.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav th:if="${alunos.totalPages > 1}" class="mt-3" aria-label="Paginação">
                <ul class="pagination justify-content-center flex-wrap">
                    <li class="page-item" th:classappend="${alunos.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/alunos(page=${alunos.number - 1}, search=${search})}">Anterior</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="${alunos.number + 1} + ' / ' + ${alunos.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${alunos.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/alunos(page=${alunos.number + 1}, search=${search})}">Próximo</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
