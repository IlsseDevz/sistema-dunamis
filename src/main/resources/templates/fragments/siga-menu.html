<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="menu-items(activeMenu)" class="list-group list-group-flush member-menu-list">
    <a href="/siga" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'dashboard'} ? 'active'">Dashboard</a>
    <a href="/siga/turma" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'turma'} ? 'active'">Minha turma</a>
    <a href="/siga/disciplinas" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'disciplinas'} ? 'active'">Minhas disciplinas</a>
    <a href="/siga/notas" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'notas'} ? 'active'">Minhas notas</a>
    <a href="/siga/presencas" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'presencas'} ? 'active'">Minhas presenças</a>
    <a href="/siga/media" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'media'} ? 'active'">Minha média</a>
    <a href="/siga/relatorios" class="list-group-item list-group-item-action"
       th:classappend="${activeMenu == 'relatorios'} ? 'active'">Relatórios</a>
    <a href="/dashboard" class="list-group-item list-group-item-action">Voltar ao painel</a>
</div>

<nav th:fragment="menu(activeMenu)" class="panel-nav">
    <div class="d-none d-lg-block">
        <div class="member-menu card card-dunamis">
            <div class="card-body p-3">
                <h2 class="h6 text-uppercase text-muted mb-1">SIGA</h2>
                <p class="small text-muted mb-3">Portal académico</p>
                <div th:replace="~{fragments/siga-menu :: menu-items(${activeMenu})}"></div>
            </div>
        </div>
    </div>

    <div class="d-lg-none mb-3">
        <button type="button" class="btn btn-dunamis-outline w-100 panel-menu-toggle"
                data-bs-toggle="offcanvas" data-bs-target="#sigaPanelMenu"
                aria-controls="sigaPanelMenu">
            Menu SIGA
        </button>
    </div>

    <div class="offcanvas offcanvas-start panel-offcanvas d-lg-none" tabindex="-1"
         id="sigaPanelMenu" aria-labelledby="sigaPanelMenuLabel">
        <div class="offcanvas-header panel-offcanvas-header">
            <h2 class="offcanvas-title h5 mb-0" id="sigaPanelMenuLabel">SIGA</h2>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body p-3">
            <p class="small text-muted mb-3">Portal académico</p>
            <div th:replace="~{fragments/siga-menu :: menu-items(${activeMenu})}"></div>
        </div>
    </div>
</nav>

</body>
</html>
