<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alterar password')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/member-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <div class="card card-dunamis">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4">Alterar password</h1>

                    <form th:action="@{/dashboard/alterar-password}" th:object="${changePassword}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Password actual *</label>
                            <input type="password" id="currentPassword" th:field="*{currentPassword}"
                                   class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   autocomplete="current-password">
                            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Nova password *</label>
                            <input type="password" id="newPassword" th:field="*{newPassword}"
                                   class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmNewPassword" class="form-label">Confirmar nova password *</label>
                            <input type="password" id="confirmNewPassword" th:field="*{confirmNewPassword}"
                                   class="form-control" th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid'"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{confirmNewPassword}"></div>
                        </div>
                        <div class="col-12" th:if="${#fields.hasErrors('passwordMatching')}">
                            <div class="alert alert-danger py-2" th:errors="*{passwordMatching}"></div>
                        </div>
                        <div class="d-grid d-sm-flex gap-2 mt-2">
                            <button type="submit" class="btn btn-dunamis">Alterar password</button>
                            <a href="/dashboard/perfil" class="btn btn-dunamis-outline">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
