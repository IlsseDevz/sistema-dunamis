<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-public}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card card-dunamis">
                <div class="card-body p-4">
                    <h1 class="h4 mb-2 text-center">Cadastro de Membro</h1>
                    <p class="text-muted text-center small mb-4">
                        Igreja Evangélica Dunamis de Jesus Cristo
                    </p>

                    <form th:action="@{/cadastro}" th:object="${registration}" method="post" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="fullName" class="form-label">Nome completo *</label>
                                <input type="text" id="fullName" th:field="*{fullName}"
                                       class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                       placeholder="Seu nome completo" autocomplete="name">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="contacto" class="form-label">Contacto *</label>
                                <input type="tel" id="contacto" th:field="*{contacto}"
                                       class="form-control" th:classappend="${#fields.hasErrors('contacto')} ? 'is-invalid'"
                                       placeholder="Ex: 923456789" autocomplete="tel">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('contacto')}"
                                     th:errors="*{contacto}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label">Email <span class="text-muted">(opcional)</span></label>
                                <input type="email" id="email" th:field="*{email}"
                                       class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       placeholder="seu@email.com" autocomplete="email">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="bairro" class="form-label">Bairro *</label>
                                <input type="text" id="bairro" th:field="*{bairro}"
                                       class="form-control" th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'"
                                       placeholder="Seu bairro" autocomplete="address-level3">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bairro')}"
                                     th:errors="*{bairro}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="churchSituation" class="form-label">Situação na igreja *</label>
                                <select id="churchSituation" th:field="*{churchSituation}"
                                        class="form-select" th:classappend="${#fields.hasErrors('churchSituation')} ? 'is-invalid'">
                                    <option value="">Selecione...</option>
                                    <option th:each="situation : ${churchSituations}"
                                            th:value="${situation}"
                                            th:text="${situation.label}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('churchSituation')}"
                                     th:errors="*{churchSituation}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="churchFunctionId" class="form-label">Função na igreja *</label>
                                <select id="churchFunctionId" th:field="*{churchFunctionId}"
                                        class="form-select" th:classappend="${#fields.hasErrors('churchFunctionId')} ? 'is-invalid'">
                                    <option value="">Selecione...</option>
                                    <option th:each="func : ${churchFunctions}"
                                            th:value="${func.id}"
                                            th:text="${func.label}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('churchFunctionId')}"
                                     th:errors="*{churchFunctionId}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <span class="form-label d-block">É batizado? *</span>
                                <div class="d-flex gap-3 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="baptizedYes"
                                               th:field="*{baptized}" th:value="true">
                                        <label class="form-check-label" for="baptizedYes">Sim</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="baptizedNo"
                                               th:field="*{baptized}" th:value="false">
                                        <label class="form-check-label" for="baptizedNo">Não</label>
                                    </div>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('baptized')}"
                                     th:errors="*{baptized}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" id="password" th:field="*{password}"
                                       class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       autocomplete="new-password">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="confirmPassword" class="form-label">Confirmar password *</label>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                                       class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                       autocomplete="new-password">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                     th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="col-12" th:if="${#fields.hasErrors('passwordMatching')}">
                                <div class="alert alert-danger py-2 mb-0" th:errors="*{passwordMatching}"></div>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-dunamis btn-lg">Cadastrar</button>
                        </div>
                    </form>

                    <p class="text-center mt-3 mb-0 small">
                        Já tem conta?
                        <a href="/login">Entrar</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
