<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Início')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-public}"></nav>

<main id="main-content" class="container hero-section flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 text-center">
            <h1 class="hero-title mb-3">Sistema Dunamis</h1>
            <p class="hero-subtitle mb-2" th:text="${@environment.getProperty('app.church.name')}">
                Igreja Evangélica Dunamis de Jesus Cristo
            </p>
            <p class="text-muted mb-4" th:text="${@environment.getProperty('app.bible-school.name')}">
                Escola Bíblica do Pregador Dunamis
            </p>
            <p class="mb-4">
                Plataforma integrada para gestão da igreja e da escola bíblica.
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="/cadastro" class="btn btn-dunamis btn-lg">Cadastrar-se</a>
                <a href="/login" class="btn btn-dunamis-outline btn-lg">Entrar</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
