<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro interno')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-public}"></nav>

<main class="container error-page flex-grow-1">
    <div>
        <div class="error-code">500</div>
        <h1 class="h4 mb-2">Erro interno</h1>
        <p class="text-muted mb-4" th:text="${message} ?: 'Ocorreu um erro inesperado.'"></p>
        <a href="/" class="btn btn-dunamis">Voltar ao início</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
