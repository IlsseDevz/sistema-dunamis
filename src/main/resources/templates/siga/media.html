<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minha média')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/siga-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <h1 class="h4 mb-4">Minha média</h1>

            <div class="card card-dunamis mb-4">
                <div class="card-body p-4 text-center">
                    <span class="text-muted d-block mb-1">Média geral</span>
                    <div class="display-6 fw-bold text-primary"
                         th:text="${summary.overallAverage != null ? summary.overallAverage : '—'}">—</div>
                </div>
            </div>

            <div class="card card-dunamis">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Disciplina</th>
                            <th>Média</th>
                            <th class="d-none d-md-table-cell">Avaliações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${summary.disciplinaGrades}">
                            <td th:text="${d.disciplinaName}">—</td>
                            <td><strong th:text="${d.average != null ? d.average : '—'}">—</strong></td>
                            <td class="d-none d-md-table-cell text-muted"
                                th:text="${#lists.size(d.grades)} + ' nota(s)'">—</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(summary.disciplinaGrades)}">
                            <td colspan="3" class="text-center text-muted py-4">
                                Sem notas para calcular média.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
