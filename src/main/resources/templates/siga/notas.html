<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minhas notas')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar-auth}"></nav>

<main id="main-content" class="container flex-grow-1 py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-3">
            <nav th:replace="~{fragments/siga-menu :: menu(${activeMenu})}"></nav>
        </div>
        <div class="col-12 col-lg-9">
            <h1 class="h4 mb-4">Minhas notas</h1>
            <p class="text-muted small mb-3">Visualização apenas — não pode alterar notas.</p>

            <div class="card card-dunamis">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Disciplina</th>
                            <th class="d-none d-md-table-cell">Tipo</th>
                            <th>Nota</th>
                            <th class="d-none d-md-table-cell">Data</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="n : ${notas}">
                            <td>
                                <strong th:text="${n.disciplina.name}">—</strong>
                                <div class="d-md-none small text-muted" th:text="${n.gradeType.label}">—</div>
                            </td>
                            <td class="d-none d-md-table-cell" th:text="${n.gradeType.label}">—</td>
                            <td><strong th:text="${n.value}">—</strong></td>
                            <td class="d-none d-md-table-cell"
                                th:text="${#temporals.format(n.recordedAt, 'dd/MM/yyyy')}">—</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(notas)}">
                            <td colspan="4" class="text-center text-muted py-4">
                                Ainda não existem notas registadas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
